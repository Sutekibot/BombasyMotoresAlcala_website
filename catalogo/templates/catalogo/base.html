{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motores Alcalá</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Conectamos tu CSS modular -->
    <link rel="stylesheet" href="{% static 'catalogo/css/styles.css' %}">
</head>
<body>
    <!-- Navbar con Menú de Hamburguesa -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-3">
        <div class="container">
            <img class="navbar-brand" src="{% static 'catalogo/img/logo.png' %} " alt="Logo Motores Alcalá" height="120" href="{% url 'inicio' %}">
            
            <!-- Botón de Hamburguesa para móviles -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="{% url 'inicio' %}">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'lista_productos' %}">Catálogo General</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido Dinámico -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer-custom py-5 mt-5">
        <div class="container">
            <div class="row">
                <div class="col-md-6 mb-4">
                    <h4 class="fw-bold">Motores Alcalá</h4>
                    <p>Especialistas en venta y distribución de motores, bombas y reductores industriales.</p>
                </div>
                <div class="col-md-6 text-md-end mb-4">
                    <h5 class="mb-3">Contáctanos directamente</h5>
                    <!-- Enlaces directos a redes -->
                    <a href="https://wa.me/523300000000" target="_blank" class="social-icon"><i class="fa-brands fa-whatsapp"></i></a>
                    <a href="#" class="social-icon"><i class="fa-brands fa-facebook"></i></a>
                    <a href="#" class="social-icon"><i class="fa-solid fa-envelope"></i></a>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
