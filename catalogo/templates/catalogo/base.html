{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motores Alcalá</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'catalogo/css/styles.css' %}?v=1.1">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-3">
        <!-- CAMBIO: container-fluid para ancho completo -->
        <div class="container-fluid px-4 px-xl-5">
            
            <!-- Logo -->
            <a class="navbar-brand" href="{% url 'inicio' %}">
                <img src="{% static 'catalogo/img/logo.png' %}" alt="Logo Motores Alcalá" height="70">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuLateral" aria-controls="menuLateral">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Panel Lateral (Offcanvas) -->
            <div class="offcanvas offcanvas-end" tabindex="-1" id="menuLateral" aria-labelledby="menuLateralLabel">
                <div class="offcanvas-header border-bottom">
                    <h5 class="offcanvas-title fw-bold text-primary" id="menuLateralLabel">Motores Alcalá</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
                </div>
                <div class="offcanvas-body align-items-center">
                    
                    <!-- NUEVO: Buscador versión Celular (Se ve en celulares, se oculta en PC) -->
                    <form class="d-flex d-lg-none mb-4 w-100" method="GET" action="{% url 'lista_productos' %}">
                        <div class="input-group">
                            <input type="text" name="q" class="form-control border-primary" placeholder="Buscar...">
                            <button class="btn btn-primary" type="submit"><i class="fa-solid fa-search"></i></button>
                        </div>
                    </form>

                    <ul class="navbar-nav ms-auto gap-3 mt-3 mt-lg-0">
                        <li class="nav-item">
                            <a class="nav-btn d-block d-lg-inline-block text-center" href="{% url 'inicio' %}">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-btn d-block d-lg-inline-block text-center" href="{% url 'lista_productos' %}">Catálogo General</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer-custom py-5 mt-5">
    <!-- CAMBIO: container-fluid aquí también -->
        <div class="container-fluid px-4 px-xl-5">
            <div class="row">
                <div class="col-md-6 mb-4">
                    <h4 class="fw-bold">Motores Alcalá</h4>
                    <p>Especialistas en venta y distribución de motores, bombas y reductores industriales.</p>
                </div>
                <div class="col-md-6 text-md-end mb-4">
                    <h5 class="mb-3">Contáctanos directamente</h5>
                    <a href="https://wa.me/523300000000" target="_blank" class="social-icon"><i class="fa-brands fa-whatsapp"></i></a>
                    <a href="#" class="social-icon"><i class="fa-brands fa-facebook"></i></a>
                    <a href="#" class="social-icon"><i class="fa-solid fa-envelope"></i></a>
                    <div class="mt-2 text-white-50">3315039901</div>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
